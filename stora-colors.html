<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stora Colors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #0a0a0b; --bg-card: #141416; --bg-card-hover: #1c1c20; --border: #2a2a2e; --text: #f0f0f2; --text-secondary: #8a8a96; --accent: #6366f1; --accent-glow: rgba(99,102,241,0.15); --radius: 12px; --radius-sm: 8px; --transition: 0.2s cubic-bezier(0.4,0,0.2,1); }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
header { padding: 3rem 2rem 2rem; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #111113 0%, var(--bg) 100%); }
.header-inner { max-width: 800px; margin: 0 auto; }
.logo { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.logo-icon { font-size: 1.75rem; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.logo-text { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; }
.logo-dot { color: var(--accent); -webkit-text-fill-color: var(--accent); }
.tagline { color: var(--text-secondary); font-size: 0.95rem; font-weight: 400; }
.toolbar { position: sticky; top: 0; z-index: 100; background: rgba(10,10,11,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
.toolbar-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; }
.search-box { flex: 1; position: relative; max-width: 500px; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-secondary); pointer-events: none; }
.search-box input { width: 100%; padding: 0.7rem 1rem 0.7rem 2.75rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color var(--transition), box-shadow var(--transition); }
.search-box input::placeholder { color: var(--text-secondary); }
.search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.search-shortcut { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: var(--border); color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; pointer-events: none; }
.view-controls { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; }
.view-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 32px; background: transparent; border: none; border-radius: 6px; color: var(--text-secondary); cursor: pointer; transition: all var(--transition); }
.view-btn svg { width: 16px; height: 16px; }
.view-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.view-btn.active { color: var(--text); background: var(--border); }
.category-nav { border-bottom: 1px solid var(--border); padding: 0.75rem 2rem; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.category-nav::-webkit-scrollbar { display: none; }
.category-nav-inner { max-width: 1400px; margin: 0 auto; display: flex; gap: 0.5rem; white-space: nowrap; }
.cat-btn { padding: 0.4rem 1rem; background: transparent; border: 1px solid var(--border); border-radius: 999px; color: var(--text-secondary); font-family: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all var(--transition); flex-shrink: 0; }
.cat-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
.cat-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }
.color-grid { max-width: 1400px; margin: 0 auto; padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.color-grid.list-view { grid-template-columns: 1fr; gap: 0.5rem; }
.category-header { grid-column: 1 / -1; padding: 1.5rem 0 0.5rem; font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.75rem; }
.category-header:first-child { padding-top: 0; }
.category-header .cat-count { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); background: var(--bg-card); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; }
.color-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: all var(--transition); position: relative; animation: fadeInUp 0.4s ease both; }
.color-card:hover { border-color: rgba(255,255,255,0.15); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
.color-swatch { height: 140px; position: relative; transition: height var(--transition); }
.color-swatch::after { content: 'Cliquer pour copier'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); color: #fff; font-size: 0.8rem; font-weight: 500; opacity: 0; transition: opacity var(--transition); }
.color-card:hover .color-swatch::after { opacity: 1; }
.color-info { padding: 0.85rem 1rem; }
.color-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; letter-spacing: -0.01em; }
.color-codes { display: flex; flex-direction: column; gap: 0.25rem; }
.color-code { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem; }
.color-code .label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); opacity: 0.7; width: 28px; flex-shrink: 0; }
.list-view .color-card { display: flex; align-items: center; border-radius: var(--radius-sm); }
.list-view .color-swatch { width: 60px; height: 60px; min-width: 60px; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.list-view .color-swatch::after { font-size: 0; }
.list-view .color-info { display: flex; align-items: center; gap: 2rem; flex: 1; padding: 0.6rem 1rem; }
.list-view .color-name { margin-bottom: 0; min-width: 160px; }
.list-view .color-codes { flex-direction: row; gap: 1.5rem; }
.toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #fff; padding: 0.7rem 1.5rem; border-radius: 999px; font-weight: 600; font-size: 0.85rem; opacity: 0; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); pointer-events: none; z-index: 1000; box-shadow: 0 10px 30px rgba(99,102,241,0.3); }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
footer { text-align: center; padding: 3rem 2rem; color: var(--text-secondary); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: 2rem; }
.empty-state { grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; color: var(--text-secondary); }
.empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; display: block; }
.empty-state p { font-size: 1rem; }
@media (max-width: 768px) {
    header { padding: 2rem 1.25rem 1.5rem; }
    .logo-text { font-size: 1.4rem; }
    .tagline { font-size: 0.85rem; }
    .toolbar { padding: 0.75rem 1.25rem; }
    .toolbar-inner { flex-wrap: wrap; }
    .search-box { max-width: 100%; order: 2; width: 100%; }
    .view-controls { order: 1; margin-left: auto; }
    .category-nav { padding: 0.75rem 1.25rem; }
    .color-grid { padding: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
    .color-swatch { height: 110px; }
    .list-view .color-info { flex-direction: column; align-items: flex-start; gap: 0.4rem; }
    .list-view .color-codes { flex-direction: column; gap: 0.25rem; }
}
@media (max-width: 480px) {
    .color-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
    .color-info { padding: 0.6rem 0.75rem; }
    .color-name { font-size: 0.8rem; }
    .color-code { font-size: 0.68rem; }
}
@keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.color-swatch.light-color { border-bottom: 1px solid var(--border); }
    </style>
</head>

];

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b}}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}}
function isLightColor(hex){const{r,g,b}=hexToRgb(hex);return(0.299*r+0.587*g+0.114*b)/255>0.75}

const grid=document.getElementById('colorGrid');
const searchInput=document.getElementById('searchInput');
const categoryNav=document.getElementById('categoryNav').querySelector('.category-nav-inner');
const toast=document.getElementById('toast');
const viewBtns=document.querySelectorAll('.view-btn');
let currentCategory='all',currentView='grid';

const categories=[...new Set(COLOR_DATA.map(c=>c.category))];
categories.forEach(cat=>{const btn=document.createElement('button');btn.className='cat-btn';btn.dataset.category=cat;btn.textContent=cat;categoryNav.appendChild(btn)});

function renderColors(){
    const query=searchInput.value.toLowerCase().trim();
    grid.innerHTML='';
    grid.className=currentView==='list'?'color-grid list-view':'color-grid';
    let filtered=COLOR_DATA;
    if(currentCategory!=='all')filtered=filtered.filter(c=>c.category===currentCategory);
    if(query)filtered=filtered.filter(c=>{const{r,g,b}=hexToRgb(c.hex);const hsl=rgbToHsl(r,g,b);return c.name.toLowerCase().includes(query)||c.hex.toLowerCase().includes(query)||`rgb(${r}, ${g}, ${b})`.includes(query)||`hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`.includes(query)||c.category.toLowerCase().includes(query)});
    if(!filtered.length){grid.innerHTML='<div class="empty-state"><span class="emoji">&#128269;</span><p>Aucune couleur trouv\u00e9e</p></div>';return}
    const grouped={};filtered.forEach(c=>{if(!grouped[c.category])grouped[c.category]=[];grouped[c.category].push(c)});
    Object.entries(grouped).forEach(([cat,colors])=>{
        const header=document.createElement('div');header.className='category-header';header.innerHTML=`${cat} <span class="cat-count">${colors.length}</span>`;grid.appendChild(header);
        colors.forEach(color=>{const{r,g,b}=hexToRgb(color.hex);const hsl=rgbToHsl(r,g,b);const card=document.createElement('div');card.className='color-card';card.setAttribute('role','button');card.setAttribute('tabindex','0');const light=isLightColor(color.hex);
        card.innerHTML=`<div class="color-swatch${light?' light-color':''}" style="background-color:${color.hex}"></div><div class="color-info"><div class="color-name">${color.name}</div><div class="color-codes"><div class="color-code"><span class="label">HEX</span> ${color.hex}</div><div class="color-code"><span class="label">RGB</span> ${r}, ${g}, ${b}</div><div class="color-code"><span class="label">HSL</span> ${hsl.h}\u00b0 ${hsl.s}% ${hsl.l}%</div></div></div>`;
        card.addEventListener('click',()=>copyColor(color.hex,color.name));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copyColor(color.hex,color.name)}});grid.appendChild(card)})
    });
}

function copyColor(hex,name){navigator.clipboard.writeText(hex).then(()=>{showToast(name+' \u2014 '+hex+' copi\u00e9 !')}).catch(()=>{const ta=document.createElement('textarea');ta.value=hex;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast(name+' \u2014 '+hex+' copi\u00e9 !')})}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2000)}

searchInput.addEventListener('input',renderColors);
document.addEventListener('click',e=>{const btn=e.target.closest('.cat-btn');if(btn){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCategory=btn.dataset.category;renderColors()}});
viewBtns.forEach(btn=>{btn.addEventListener('click',()=>{viewBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentView=btn.dataset.view;renderColors()})});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==searchInput){e.preventDefault();searchInput.focus()}if(e.key==='Escape'&&document.activeElement===searchInput){searchInput.value='';searchInput.blur();renderColors()}});
renderColors();
</script>
</body>
</html>
