<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stora Colors — Référence des Couleurs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">◆</span>
                <span class="logo-text">Stora<span class="logo-dot">.</span>Colors</span>
            </div>
            <p class="tagline">Référence complète des couleurs — HEX · RGB · HSL</p>
        </div>
    </header>

    <div class="toolbar">
        <div class="toolbar-inner">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Rechercher une couleur, un code hex, rgb...">
                <kbd class="search-shortcut">/</kbd>
            </div>
            <div class="view-controls">
                <button class="view-btn active" data-view="grid" title="Grille">
                    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </button>
                <button class="view-btn" data-view="list" title="Liste">
                    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="17" width="18" height="3" rx="1"/></svg>
                </button>
            </div>
        </div>
    </div>

    <nav class="category-nav" id="categoryNav">
        <div class="category-nav-inner">
            <button class="cat-btn active" data-category="all">Toutes</button>
        </div>
    </nav>

    <main id="colorGrid" class="color-grid"></main>

    <div class="toast" id="toast">Copié !</div>

    <footer>
        <p>Stora Colors — Référence de couleurs pour designers & développeurs</p>
    </footer>

    <script src="colors.js"></script>
    <script src="app.js"></script>
</body>
</html>
